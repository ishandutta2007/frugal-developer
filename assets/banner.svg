<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="pill-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pill-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pill-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pill-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-indigo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <style>
      .font-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .font-sub { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
      .font-code { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; font-weight: 600; }
      
      /* Background dynamic pulsing / floating */
      @keyframes floatSlow1 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(30px, -20px) scale(1.1); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes floatSlow2 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-35px, 25px) scale(1.12); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.2; stroke-dashoffset: 0; }
        50% { opacity: 0.6; stroke-dashoffset: 40; }
      }
      @keyframes floatPill {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }

      .orb-1 { animation: floatSlow1 10s ease-in-out infinite; }
      .orb-2 { animation: floatSlow2 12s ease-in-out infinite; }
      .beam-line { stroke-dasharray: 8 6; animation: pulseBeam 6s linear infinite; }
      .pill-1 { animation: floatPill 5s ease-in-out infinite; }
      .pill-2 { animation: floatPill 6s ease-in-out infinite 1s; }
      .pill-3 { animation: floatPill 5.5s ease-in-out infinite 0.5s; }
      .pill-4 { animation: floatPill 6.5s ease-in-out infinite 1.5s; }
    </style>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- 2. Dynamic Floating Ambient Orbs (strictly in background) -->
  <g class="orb-1">
    <circle cx="220" cy="110" r="140" fill="#0284c7" opacity="0.18" filter="url(#glow-teal)" />
  </g>
  <g class="orb-2">
    <circle cx="980" cy="300" r="160" fill="#6366f1" opacity="0.18" filter="url(#glow-indigo)" />
  </g>
  <g class="orb-1">
    <circle cx="1020" cy="90" r="100" fill="#10b981" opacity="0.12" filter="url(#glow-teal)" />
  </g>

  <!-- 3. Grid Pattern Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#grid-pattern)" />

  <!-- 4. Subtle Dynamic Tech Beams (background) -->
  <g class="beam-line">
    <path d="M 50,330 Q 300,370 600,340 T 1150,350" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />
    <path d="M 50,90 Q 400,50 800,80 T 1150,70" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.25" />
  </g>

  <!-- 5. Interactive / Dynamic Category Pills (Positioned safely below and around, title stays clear in foreground) -->
  <g class="pill-1" transform="translate(140, 315)">
    <rect width="180" height="38" rx="19" fill="url(#pill-grad-1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="19" r="6" fill="#38bdf8" />
    <text x="35" y="24" fill="#bae6fd" class="font-code">☁️ Free Hosting</text>
  </g>

  <g class="pill-2" transform="translate(360, 315)">
    <rect width="190" height="38" rx="19" fill="url(#pill-grad-2)" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="19" r="6" fill="#34d399" />
    <text x="35" y="24" fill="#a7f3d0" class="font-code">🗄️ Free Databases</text>
  </g>

  <g class="pill-3" transform="translate(590, 315)">
    <rect width="190" height="38" rx="19" fill="url(#pill-grad-3)" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="19" r="6" fill="#a78bfa" />
    <text x="35" y="24" fill="#ddd6fe" class="font-code">🔐 Auth &amp; Identity</text>
  </g>

  <g class="pill-4" transform="translate(820, 315)">
    <rect width="210" height="38" rx="19" fill="url(#pill-grad-4)" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="19" r="6" fill="#fbbf24" />
    <text x="35" y="24" fill="#fef3c7" class="font-code">⚡ Generative APIs</text>
  </g>

  <!-- 6. Foreground Content (Always crisp, prominent, unobstructed) -->
  <!-- Badge Pill -->
  <g transform="translate(485, 62)">
    <rect width="230" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" opacity="0.9" />
    <circle cx="16" cy="16" r="4" fill="#10b981" />
    <text x="28" y="21" fill="#cbd5e1" class="font-sub" font-size="13px" letter-spacing="0.5">CURATED DEVELOPER DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 155)">
    <!-- Shadow for depth -->
    <text text-anchor="middle" fill="#000000" opacity="0.4" class="font-title" font-size="54px" x="2" y="2">FRUGAL DEVELOPER</text>
    <!-- Gradient Text -->
    <text text-anchor="middle" fill="url(#title-grad)" class="font-title" font-size="54px">FRUGAL DEVELOPER</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 205)">
    <text text-anchor="middle" fill="#f8fafc" class="font-sub" font-size="20px" opacity="0.95">
      The Curated Directory of Free Tools, Free Tiers &amp; APIs for Developers
    </text>
  </g>

  <!-- Tagline / Value Proposition -->
  <g transform="translate(600, 245)">
    <text text-anchor="middle" fill="#94a3b8" class="font-sub" font-size="15px">
      Build MVPs, prototype ideas, and scale side projects on a $0 budget 🚀
    </text>
  </g>
</svg>
